# .github/workflows/inspectra-ollama.yml
name: Inspectra Review

on:
  pull_request:
    branches:
        - dev-Akash

jobs:
  inspectra:
    runs-on: self-hosted

    permissions:
      pull-requests: write
      contents: read

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install inspectra --upgrade

      - run: ollama serve &
        continue-on-error: true

      - run: sleep 3

      - run: |
          inspectra review \
            --provider ollama \
            --model qwen2.5-coder:14b \
            --post-comment \
            --pr ${{ github.event.pull_request.number }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}