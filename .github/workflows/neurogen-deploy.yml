name: Deploy Neurogen to Azure VM

on:
  push:
    branches:
      - dev-Akash

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to Azure VM via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            set -e

            echo "──────────────────────────────────"
            echo " Pulling latest code"
            echo "──────────────────────────────────"
            cd /home/Neurogenweb/projects/Neurogen_Web
            git pull origin main

            echo "──────────────────────────────────"
            echo " Creating Backend .env"
            echo "──────────────────────────────────"
            {
            echo "TZ=${{ secrets.TZ }}"
            echo "PORT=${{ secrets.PORT }}"
            echo "HOST=${{ secrets.HOST }}"
            echo "LOG_LEVEL=${{ secrets.LOG_LEVEL }}"
            echo "NODE_ENV=${{ secrets.NODE_ENV }}"
            echo "SESSION_DRIVER=${{ secrets.SESSION_DRIVER }}"
            echo "APP_KEY=${{ secrets.APP_KEY }}"
            echo "GITHUB_CLIENT_ID=${{ secrets.GH_CLIENT_ID }}"
            echo "GITHUB_CLIENT_SECRET=${{ secrets.GH_CLIENT_SECRET }}"
            echo "GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}"
            echo "GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET }}"
            echo "DB_HOST=${{ secrets.DB_HOST }}"
            echo "DB_PORT=${{ secrets.DB_PORT }}"
            echo "DB_USER=${{ secrets.DB_USER }}"
            echo "DB_PASSWORD=${{ secrets.DB_PASSWORD }}"
            echo "DB_DATABASE=${{ secrets.DB_DATABASE }}"
            echo "RUL_URL=${{ secrets.RUL_URL }}"
            echo "PDM_URL=${{ secrets.PDM_URL }}"
            echo "ANOMALY_URL=${{ secrets.ANOMALY_URL }}"
            echo "ML_API_KEY=${{ secrets.ML_API_KEY }}"
            } > apps/backend/.env
            chmod 600 apps/backend/.env

            echo "──────────────────────────────────"
            echo " Creating Frontend .env"
            echo "──────────────────────────────────"
            {
            echo "VITE_BACKEND_URL=${{ secrets.VITE_BACKEND_URL }}"
            echo "VITE_RUL_API=${{ secrets.RUL_URL }}"
            echo "VITE_PDM_API=${{ secrets.PDM_URL }}"
            echo "VITE_ANOMALY_API=${{ secrets.VITE_ANOMALY_API }}"
            } > apps/frontend/.env
            chmod 600 apps/frontend/.env

            echo "──────────────────────────────────"
            echo " Installing dependencies"
            echo "──────────────────────────────────"
            pnpm install --frozen-lockfile

            echo "──────────────────────────────────"
            echo " Building project"
            echo "──────────────────────────────────"
            pnpm build

            echo "──────────────────────────────────"
            echo " Restarting Node.js Services"
            echo "──────────────────────────────────"
            sudo systemctl restart neurogen-frontend.service
            sudo systemctl restart neurogen-backend.service

            echo "──────────────────────────────────"
            echo " Restarting ML Services"
            echo "──────────────────────────────────"
            sudo systemctl restart anomaly_1phase.service
            sudo systemctl restart pdm.service
            sudo systemctl restart rul.service

            echo "──────────────────────────────────"
            echo " Verifying services"
            echo "──────────────────────────────────"
            sleep 5

            wait_for_service() {
              local svc=$1
              local retries=6
              while [ $retries -gt 0 ]; do
                if sudo systemctl is-active --quiet "$svc"; then
                  echo "✅ $svc is active"
                  return 0
                fi
                echo "⏳ Waiting for $svc..."
                sleep 5
                retries=$((retries - 1))
              done
              echo "❌ $svc failed to start"
              sudo systemctl status "$svc"
              return 1
            }

            wait_for_service neurogen-frontend.service
            wait_for_service neurogen-backend.service
            wait_for_service anomaly_1phase.service
            wait_for_service pdm.service
            wait_for_service rul.service

            echo "✅ Deployment complete!"
